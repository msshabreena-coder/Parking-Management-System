
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parking-v2
  template:
    metadata:
      labels:
        app: parking-v2
    spec:
      containers:
        - name: parking
          image: shabbu2007/parking-management-system:v2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: parking-v2-service
spec:
  type: NodePort
  selector:
    app: parking-v2
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30082
