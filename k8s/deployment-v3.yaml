apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parking-v3
  template:
    metadata:
      labels:
        app: parking-v3
    spec:
      containers:
        - name: parking
          image: shabbu2007/parking-management-system:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: parking-v3-service
spec:
  type: NodePort
  selector:
    app: parking-v3
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30083
